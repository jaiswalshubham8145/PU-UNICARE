<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#060F10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#164340"/>
      <stop offset="50%" stop-color="#0d2422"/>
      <stop offset="100%" stop-color="#08141F"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE"/>
      <stop offset="50%" stop-color="#E0C88B"/>
      <stop offset="100%" stop-color="#9C7A28"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background base -->
  <rect width="512" height="512" rx="112" fill="#060F10"/>
  <circle cx="256" cy="256" r="230" fill="url(#bgGlow)"/>

  <!-- Shield Base -->
  <path d="M 256 56 L 420 100 V 270 C 420 370 330 436 256 464 C 182 436 92 370 92 270 V 100 Z"
        fill="url(#shieldGrad)"
        stroke="url(#goldGrad)"
        stroke-width="12"
        stroke-linejoin="round"
        filter="url(#goldGlow)"/>

  <!-- Inner accent ring -->
  <path d="M 256 78 L 400 116 V 265 C 400 352 320 412 256 438 C 192 412 112 352 112 265 V 116 Z"
        fill="none"
        stroke="#34D399"
        stroke-width="3"
        stroke-opacity="0.6"/>

  <!-- Brand Typography: PU -->
  <text x="256" y="240"
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', Arial, sans-serif"
        font-size="140"
        font-weight="900"
        text-anchor="middle"
        dominant-baseline="central"
        fill="url(#goldGrad)"
        letter-spacing="2">PU</text>

  <!-- Brand Typography: UNICARE -->
  <text x="256" y="325"
        font-family="system-ui, -apple-system, 'Space Mono', monospace"
        font-size="40"
        font-weight="800"
        text-anchor="middle"
        dominant-baseline="central"
        fill="#34D399"
        letter-spacing="8">UNICARE</text>

  <!-- Golden Emblem Sparkle / Cross -->
  <g transform="translate(256, 385)">
    <circle cx="0" cy="0" r="8" fill="#E0C88B"/>
    <path d="M 0 -18 L 4 -4 L 18 0 L 4 4 L 0 18 L -4 4 L -18 0 L -4 -4 Z" fill="url(#goldGrad)"/>
  </g>
</svg>

